name: Self-Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-verify:
    name: Build, typecheck, test, verify dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test public surface
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Verify dist is committed
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit the result."
            git status --porcelain dist/
            git --no-pager diff -- dist/ | head -100
            exit 1
          fi
          echo "dist/ is in sync with src/"
